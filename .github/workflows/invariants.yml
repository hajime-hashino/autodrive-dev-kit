name: invariants

# 横断判定は kit の定期実行が担う。各リポジトリの CI は自リポジトリの範囲のみを
# 判定する（docs/invariants.md の「実行範囲」を参照）。
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm test

  # **判定が本当に判定しているかを見る。** テストが通ることと、テストが誤りを
  # 捕まえられることは別である。過去に直した誤りを実装へ戻し、そのたびにテストが
  # 落ちるかを確かめる（AUT-138）。所要は1分弱。
  mutate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm run mutate

  cross:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: kit を取得する
        uses: actions/checkout@v4
        with:
          path: work/autodrive-dev-kit
          # **既定ブランチの履歴が要る。** 提出を経ずに入った変更の検出は
          # first-parent を辿って判定するため、浅いチェックアウトでは
          # 「判定できない」として失敗する。他の3リポジトリは git clone で
          # 全履歴を取得している。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: 判定対象のリポジトリを取得する
        # **名前を実態に合わせる。** ここに要るのは読取だけであり、渡しているのは
        # 読取専用の AUTODRIVE_CI_TOKEN である。以前はこれを GH_TOKEN という名前で
        # 受けていたため、**読んだ人は「CI に書き込み用の鍵がある」と受け取った。**
        # 実際に、それを前提にした誤った案内を出している（AUT-139）。
        #
        # `GH_TOKEN` は gh CLI が拾う名前でもある。**CI では使わない。**
        env:
          CLONE_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
        run: |
          set -eu
          for repo in autodrive-dev-work autodrive-dev-definition agent-playground; do
            git clone --quiet \
              "https://x-access-token:${CLONE_TOKEN}@github.com/${{ github.repository_owner }}/${repo}.git" \
              "work/${repo}"
          done
          # 横断判定の起点は autodrive-dev-work であり、他のリポジトリはその直下に置く。
          mv work/autodrive-dev-kit work/autodrive-dev-definition work/agent-playground \
             work/autodrive-dev-work/

      - name: 発効を判定する
        env:
          AUTODRIVE_CI_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
          # 横断の判定では、記録が指す作業単位が実在するかを Tracker と突き合わせる。
          # self では突き合わせないため、各リポジトリの CI には渡していない。
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: work/autodrive-dev-work/autodrive-dev-kit/invariants --root work/autodrive-dev-work

      - name: 判定結果を残す
        if: always()
        env:
          AUTODRIVE_CI_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          work/autodrive-dev-work/autodrive-dev-kit/invariants \
            --root work/autodrive-dev-work --format json > invariants.json || true
          {
            echo '```json'
            cat invariants.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invariants-result
          path: invariants.json
