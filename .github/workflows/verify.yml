name: verify

# 横断判定は kit の定期実行が担う。各リポジトリの CI は自リポジトリの範囲のみを
# 判定する（docs/verify-criteria.md の「実行範囲」を参照）。
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  pull_request:
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - name: kit を取得する
        uses: actions/checkout@v4
        with:
          path: work/autodrive-dev-kit

      - name: 判定対象のリポジトリを取得する
        env:
          GH_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
        run: |
          set -eu
          for repo in autodrive-dev-work autodrive-dev-definition agent-playground; do
            git clone --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${repo}.git" \
              "work/${repo}"
          done
          # 横断判定の起点は autodrive-dev-work であり、他のリポジトリはその直下に置く。
          mv work/autodrive-dev-kit work/autodrive-dev-definition work/agent-playground \
             work/autodrive-dev-work/

      - name: 発効を判定する
        env:
          AUTODRIVE_CI_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
        run: work/autodrive-dev-work/autodrive-dev-kit/verify --root work/autodrive-dev-work

      - name: 判定結果を残す
        if: always()
        env:
          AUTODRIVE_CI_TOKEN: ${{ secrets.AUTODRIVE_CI_TOKEN }}
        run: |
          work/autodrive-dev-work/autodrive-dev-kit/verify \
            --root work/autodrive-dev-work --format json > verify.json || true
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat verify.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-result
          path: verify.json
