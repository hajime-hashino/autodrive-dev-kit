<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 890" width="1360" height="890"
     role="img" aria-label="Diagram of four areas (human, sandbox, record, run) and the path one change takes">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6167"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4472f"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8878"/>
    </marker>
    <style>
      text { font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif; }
      .bx  { fill:#fff; stroke:#d8dcdf; stroke-width:1.2; }
      .ttl { font-size:15px; font-weight:600; fill:#1a1d1f; }
      .sub { font-size:12px; fill:#6b7280; }
      .grp { font-size:11.5px; fill:#8a9199; letter-spacing:.22em; }
      .ln  { stroke:#5b6167; stroke-width:1.3; fill:none; }
      .fb  { stroke:#4a8878; stroke-width:1.3; fill:none; stroke-dasharray:5 4; }
      .tag { font-size:10.5px; fill:#b4472f; letter-spacing:.14em; font-weight:600; }
    </style>
  </defs>

  <!-- lay a background so it stays readable on dark themes -->
  <rect class="bg" x="0" y="0" width="1360" height="890" fill="#ffffff"/>

  <!-- ================= human ================= -->
  <rect class="bx" x="60" y="24" width="414" height="72" rx="3" fill="#f2f3f4"/>
  <text class="ttl" x="80" y="52">Human</text>
  <text class="sub" x="80" y="74">Decisions / spot checks / approving merges / releases</text>

  <!-- ================= SANDBOX ================= -->
  <rect x="32" y="128" width="470" height="470" rx="4"
        fill="none" stroke="#b8bec4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="grp" x="56" y="152">SANDBOX / devcontainer</text>

  <rect class="bx" x="60" y="176" width="414" height="92" rx="3" fill="#eaf3f0" stroke="#9cc3b7"/>
  <text class="ttl" x="80" y="205">Coding Agent (Claude Code)</text>
  <text class="sub" x="80" y="227">Leads implementation, checks, submission via ports</text>
  <text class="sub" x="80" y="247">Hands back to the human at stopping conditions</text>

  <rect class="bx" x="60" y="286" width="414" height="80" rx="3"/>
  <text class="ttl" x="80" y="314">autodrive/ (the copied tool)</text>
  <text class="sub" x="80" y="336">invariants / recording hook / CLI</text>
  <text class="sub" x="80" y="356">Version pinned per project</text>

  <rect class="bx" x="60" y="384" width="196" height="80" rx="3"/>
  <text class="ttl" x="80" y="412">Working tree</text>
  <text class="sub" x="80" y="434">Source / docs/adr</text>
  <text class="sub" x="80" y="454">boundaries.yaml</text>

  <rect class="bx" x="278" y="384" width="196" height="80" rx="3"/>
  <text class="ttl" x="298" y="412">Local checks</text>
  <text class="sub" x="298" y="434">test / types / lint</text>
  <text class="sub" x="298" y="454">Mutation testing</text>

  <text class="tag" x="60" y="500">GUARDRAIL</text>
  <text class="sub" x="60" y="522">Egress is allowlisted, built from setup, applied on every start.</text>
  <text class="sub" x="60" y="542">It narrows where traffic goes; not a mechanism that closes it.</text>
  <text class="sub" x="60" y="562">Not editing it is a convention, not mechanical enforcement.</text>

  <!-- ================= TRACK / RECORD ================= -->
  <text class="grp" x="548" y="152">TRACK / RECORD</text>

  <rect class="bx" x="548" y="176" width="340" height="88" rx="3"/>
  <text class="ttl" x="568" y="205">Linear (Tracker)</text>
  <text class="sub" x="568" y="227">Work items / status</text>
  <text class="sub" x="568" y="247">Work log / decision log</text>

  <!-- GitHub is a container. records accumulate inside it -->
  <rect class="bx holder" x="548" y="284" width="340" height="372" rx="4" fill="#fafbfb"/>
  <text class="ttl" x="568" y="312">GitHub (Repo)</text>

  <rect class="bx" x="568" y="328" width="300" height="62" rx="3"/>
  <text class="ttl" x="586" y="354">Submission (PR)</text>
  <text class="sub" x="586" y="376">Diff, CI results, and comments</text>

  <rect class="bx" x="568" y="402" width="300" height="76" rx="3" fill="#fbeee9" stroke="#d9a08e"/>
  <text class="ttl" x="586" y="428">Integration (merge)</text>
  <text class="tag" x="782" y="426">By a human</text>
  <text class="sub" x="586" y="450">Approval is received here</text>
  <text class="sub" x="586" y="470">Irreversible. No direct push to default</text>

  <rect class="bx" x="568" y="490" width="300" height="56" rx="3"/>
  <text class="ttl" x="586" y="516">docs/adr / delegation history</text>
  <text class="sub" x="586" y="536">Design decisions; how delegation moved</text>

  <rect class="bx" x="568" y="558" width="300" height="80" rx="3"/>
  <text class="ttl" x="586" y="584">telemetry/*.jsonl</text>
  <text class="sub" x="586" y="606">Stops / rework / missed detections</text>
  <text class="sub" x="586" y="626">Spot checks / token consumption</text>

  <rect class="bx" x="548" y="690" width="340" height="88" rx="3"/>
  <text class="ttl" x="568" y="719">invariants (the checker)</text>
  <text class="sub" x="568" y="741">Mechanically judges if invariants are active</text>
  <text class="sub" x="568" y="761">Runs from both CI and locally</text>

  <!-- ================= RUN / RELEASE ================= -->
  <text class="grp" x="946" y="152">RUN / RELEASE</text>

  <rect class="bx" x="946" y="176" width="314" height="84" rx="3"/>
  <text class="ttl" x="966" y="205">Runner (GitHub Actions)</text>
  <text class="sub" x="966" y="227">Runs checks and deploys</text>
  <text class="sub" x="966" y="247">Rejects changes without a submission</text>

  <!-- one deployment target. say it once by enclosing, not per box -->
  <rect x="930" y="274" width="346" height="486" rx="4"
        fill="none" stroke="#b8bec4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="grp" x="946" y="296">Cloudflare Workers (default)</text>

  <rect class="bx holder" x="946" y="312" width="314" height="176" rx="4" fill="#fafbfb"/>
  <text class="ttl" x="966" y="340">Verification environment</text>

  <rect class="bx" x="964" y="352" width="278" height="80" rx="3"/>
  <text class="ttl" x="982" y="378">Preview</text>
  <text class="sub" x="982" y="400">Runs on verification; not separate</text>
  <text class="sub" x="982" y="420">Check how it looks per submission</text>

  <text class="sub" x="966" y="454">Has production-like credentials and data</text>
  <text class="sub" x="966" y="474">Human approves making it visible outside</text>

  <rect class="bx" x="946" y="516" width="314" height="84" rx="3" fill="#fbeee9" stroke="#d9a08e"/>
  <text class="ttl" x="966" y="544">Production</text>
  <text class="tag" x="1196" y="542">FIXED</text>
  <text class="sub" x="966" y="566">Irreversible deploy. A human triggers it</text>
  <text class="sub" x="966" y="586">Never loosened, whatever the track record</text>

  <rect class="bx" x="946" y="632" width="314" height="104" rx="3"/>
  <text class="ttl" x="966" y="661">Flag (none by default)</text>
  <text class="sub" x="966" y="683">Any OpenFeature-conforming implementation</text>
  <text class="sub" x="966" y="703">Widens exposure in stages</text>
  <text class="sub" x="966" y="723">Widening is irreversible; reverting is not</text>

  <!-- ================= paths ================= -->
  <path class="ln" d="M 430 96 V 170" marker-end="url(#a)"/>

  <path class="ln" d="M 474 222 H 524"/>
  <path class="ln" d="M 524 222 V 596"/>
  <path class="ln" d="M 524 222 H 542" marker-end="url(#a)"/>
  <path class="ln" d="M 524 358 H 562" marker-end="url(#a)"/>
  <path class="ln" d="M 524 596 H 562" marker-end="url(#a)"/>

  <!-- submission → integration (irreversible) -->
  <path class="ln" stroke="#b4472f" d="M 718 390 V 396" marker-end="url(#ar)"/>

  <!-- repository → checker -->
  <path class="ln" d="M 718 656 V 684" marker-end="url(#a)"/>

  <!-- submission → verification -->
  <path class="ln" d="M 888 340 H 920 V 218 H 940" marker-end="url(#a)"/>

  <path class="ln" d="M 1200 260 V 306" marker-end="url(#a)"/>
  <path class="ln" stroke="#b4472f" d="M 1200 488 V 510" marker-end="url(#ar)"/>
  <path class="ln" d="M 1200 632 V 606" marker-end="url(#a)"/>

  <!-- ================= feedback ================= -->
  <!-- submission comments and CI results -->
  <path class="fb" d="M 868 372 H 902 V 850"/>
  <!-- check results, behavior, production anomalies -->
  <path class="fb" d="M 1260 218 H 1330"/>
  <path class="fb" d="M 1260 392 H 1330"/>
  <path class="fb" d="M 1260 558 H 1330"/>
  <path class="fb" d="M 1330 218 V 850"/>
  <path class="fb" d="M 1330 850 H 200 V 604" marker-end="url(#at)"/>
  <text class="grp" x="360" y="838" fill="#4a8878">FEEDBACK / comments, check results, behavior, production anomalies</text>

  <!-- ================= legend ================= -->
  <path class="ln" d="M 560 862 H 596" marker-end="url(#a)"/>
  <text class="sub" x="606" y="866">Flow of operations</text>
  <path class="fb" d="M 706 862 H 742"/>
  <text class="sub" x="752" y="866">Feedback</text>
  <path class="ln" stroke="#b4472f" d="M 878 862 H 914" marker-end="url(#ar)"/>
  <text class="sub" x="924" y="866">Irreversible operations</text>
</svg>
