name: invariants

# Only checks within the scope of this repository. Invariants that hold only
# across repositories are looked at by the scheduled run on the autodrive-dev-kit side.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # **The default branch's history is needed.** Detecting changes that entered
          # without a submission follows first-parent, so a shallow fetch cannot judge it.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          # **Turn off the package manager cache.** By default it looks at the lock file
          # at the top and tries to cache with that manager. In projects using
          # pnpm / yarn / bun, **the check itself fails** if that executable is missing
          # (AUT-180; it actually failed with `Unable to locate executable file: pnpm`).
          #
          # **The checks use no dependencies at all.** autodrive-dev-kit has zero
          # dependencies and runs with node alone. Do not bring in the project's
          # circumstances for a cache that is not needed.
          package-manager-cache: false

      - name: Run the checks
        run: {{KIT}}/invariants --root . --scope self
