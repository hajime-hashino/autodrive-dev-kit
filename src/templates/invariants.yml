name: invariants

# このリポジトリの範囲の判定のみを行う。リポジトリをまたいで初めて成立する
# 不変条件は、参照実装側の定期実行が見る。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # **既定ブランチの履歴が要る。** 提出を経ずに入った変更の検出は
          # first-parent を辿って判定するため、浅い取得では判定できない。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          # **パッケージ管理のキャッシュを止める。** 既定では直下の lock ファイルを
          # 見て、その管理ツールでキャッシュしようとする。pnpm / yarn / bun を使う
          # プロジェクトでは、その実行ファイルが無いと**判定そのものが落ちる**
          # （AUT-180、実際に `Unable to locate executable file: pnpm` で落ちた）。
          #
          # **判定は依存を1つも使わない。** 参照実装は依存ゼロであり、node さえ
          # あれば走る。要らないキャッシュのために、プロジェクト側の都合を
          # 持ち込まない。
          package-manager-cache: false

      - name: 判定する
        run: {{KIT}}/invariants --root . --scope self
