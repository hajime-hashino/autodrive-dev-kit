# Delegation table
#
# For each area, note whether it is detectable and whether it is reversible, and hold the state of what is entrusted.
#
#                  | not detectable     | detectable
#   not reversible | fixed condition    | automated gate + human trigger
#   reversible     | spot check         | full delegation
#
# There are three states: on hold / under observation / delegated.
#   loosening      : if N consecutive times under observation pass without human correction, move to delegated
#   tightening back: if a failure occurs while delegated, return to under observation
#   **Loosening and tightening back are always operated as a pair.**
#
# The AI proposes changes, the human approves, and **the history is always kept** (docs/boundary-changes.md).
#
# ---
#
# **Do not fill in the initial state by guessing.** Build it from the records once they show where humans
# actually looked. Areas that were looked at are on hold; areas that were not looked at are delegated.
#
# If the declaration and reality drift apart, that itself is a signal to read.

version: 1

areas: []
